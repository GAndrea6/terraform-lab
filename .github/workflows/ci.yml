name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Docker build
        run: docker build -t mia-app .

      - name: Test container (curl /health)
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ENV=production mia-app
          sleep 3
          curl -f http://localhost:3000/health
          echo
          curl -f http://localhost:3000/version

      - name: Container logs
        if: always()
        run: docker logs app